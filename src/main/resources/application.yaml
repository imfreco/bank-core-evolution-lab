spring:
  application:
    name: bank-core-evolution-lab
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bank_core}
    username: ${SPRING_DATASOURCE_USERNAME:bank}
    password: ${SPRING_DATASOURCE_PASSWORD:bank}
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/bank_read_model}
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

bank:
  security:
    jwt:
      secret: ${BANK_SECURITY_JWT_SECRET:bank-core-evolution-lab-demo-secret-change-me}
      expiration-seconds: ${BANK_SECURITY_JWT_EXPIRATION_SECONDS:3600}
  outbox:
    publisher:
      enabled: ${BANK_OUTBOX_PUBLISHER_ENABLED:true}
      fixed-delay: ${BANK_OUTBOX_PUBLISHER_FIXED_DELAY:5000}
  projections:
    mongodb:
      enabled: ${BANK_MONGODB_PROJECTION_ENABLED:true}
      fixed-delay: ${BANK_MONGODB_PROJECTION_FIXED_DELAY:15000}
