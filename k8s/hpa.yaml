apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bank-core-app
  namespace: bank-core
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bank-core-app
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  # HPA escala horizontalmente segun metricas; en produccion sumaria latencia, RPS y backlog outbox.
